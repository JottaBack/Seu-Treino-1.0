<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Seu Treino - Login</title>
</head>
<body>
    <h1>Seu Treino</h1>
    <h2>Login</h2>

    {% for mensagem in get_flashed_messages() %}
        <p>{{ mensagem }}</p>
    {% endfor %}

    <form method="post" action="{{ url_for('inicio') }}">
        <label for="usuario">Usuário:</label>
        <input id="usuario" name="usuario" autocomplete="username" required>

        <label for="senha">Senha:</label>
        <input id="senha" name="senha" type="password" autocomplete="current-password" required>

        <button type="submit">Entrar</button>
    </form>

    <h2>Criar conta</h2>
    <form method="post" action="{{ url_for('cadastrar') }}">
        <label for="novo-usuario">Usuário:</label>
        <input id="novo-usuario" name="usuario" autocomplete="username" required>

        <label for="nova-senha">Senha:</label>
        <input id="nova-senha" name="senha" type="password" autocomplete="new-password" required>

        <button type="submit">Cadastrar</button>
    </form>
</body>
</html>
